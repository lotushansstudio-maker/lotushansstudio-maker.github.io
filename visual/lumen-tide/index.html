<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>光潮 · Lumen Tide</title>
<meta name="description" content="Guide a glowing orb across a night sea of tens of thousands of points of light. 引导一颗光球掠过由几万个光点组成的夜海。">
<meta property="og:title" content="光潮 · Lumen Tide">
<meta property="og:description" content="Guide a glowing orb across a night sea of light; tap to splash, hold and release to burst. 引导光球掠过光点夜海，点一下溅起水花，按住松开爆发。">
<meta property="og:image" content="https://lotushansstudio-maker.github.io/visual/lumen-tide/og.jpg">
<meta property="og:url" content="https://lotushansstudio-maker.github.io/visual/lumen-tide/">
<style>
  :root{
    --ink:#e9eef8; --dim:rgba(233,238,248,.55); --line:rgba(233,238,248,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#03050c;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  /* 暗角：让画面像油画一样“收”在中间 */
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 60%,transparent 45%,rgba(0,0,0,.55) 100%)}
  .title{position:fixed;left:max(20px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));pointer-events:none}
  .title h1{font-family:"Songti SC","Noto Serif SC","STSong",Georgia,serif;font-weight:400;
    font-size:clamp(26px,4.2vw,44px);letter-spacing:.18em}
  .title p{margin-top:6px;font-size:12px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));
    font-size:12.5px;color:var(--dim);letter-spacing:.06em;text-align:center;pointer-events:none;
    width:min(92vw,640px);line-height:1.8;transition:opacity 1.2s}
  .hint b{color:var(--ink);font-weight:500}
  .ctrl{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));
    display:flex;gap:8px}
  .ctrl button{font:inherit;font-size:12px;letter-spacing:.08em;color:var(--ink);background:rgba(10,14,28,.45);
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .3s,border-color .3s}
  .ctrl button:hover{background:rgba(40,50,80,.55)}
  .ctrl button.on{border-color:rgba(255,210,140,.7)}
  /* 摄像头运动预览：像素风小窗 */
  #prev{position:fixed;right:max(16px,env(safe-area-inset-right));top:calc(max(18px,env(safe-area-inset-top)) + 46px);
    width:128px;height:96px;border-radius:10px;border:1px solid var(--line);image-rendering:pixelated;
    transform:scaleX(-1);display:none;opacity:.85}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:12px;
    background:rgba(10,14,28,.75);border:1px solid var(--line);font-size:13px;opacity:0;pointer-events:none;transition:opacity .4s;
    text-align:center;max-width:86vw}
  @media (max-width:560px){ .hint{font-size:11.5px} .title p{letter-spacing:.2em} }
  /* 英文标题较长：窄屏收紧字距，别压到右上角按钮 */
  html[lang=en] .title h1{letter-spacing:.08em}
  @media (max-width:560px){ html[lang=en] .title h1{font-size:21px;letter-spacing:.04em} .ctrl{gap:6px} .ctrl button{padding:7px 11px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="title"><h1 id="tT">光潮</h1><p id="tS">Lumen Tide</p></div>
<div class="ctrl">
  <button id="bCam" title="快捷键 C">摄像头</button>
  <button id="bPal" title="快捷键 1 2 3">换色</button>
  <button id="bLang">EN</button>
</div>
<canvas id="prev" width="64" height="48"></canvas>
<div class="hint" id="hint"></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   光潮 Lumen Tide —— 一片由几万个光点组成的“海”
   - 海面高度用经典的二维波动方程（Hugo Elias 涟漪算法）在 CPU 上模拟
   - 每个格点就是一个粒子，用 WebGL 点精灵绘制（不依赖任何外部库）
   - 光球压住海面形成凹陷，移动时拖出尾迹，松开时激起水花
   ========================================================= */

const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
const toastEl = document.getElementById('toast');
// ================= 双语（和主页共用 lotus-lang） =================
const I18 = {
  zh: { title: '光潮', sub: 'Lumen Tide', cam: '摄像头', pal: '换色', camT: '快捷键 C', palT: '快捷键 1 2 3',
    hint: '<b>移动 / 拖动</b> 引导光球 · <b>点一下</b> 溅起水花 · <b>按住</b> 下潜蓄力，松开爆发<br><b>摄像头</b>：对着镜头挥手 · 键盘 <b>方向键</b> + <b>空格</b> · <b>1 2 3</b> 换配色',
    noGL: '你的浏览器不支持 WebGL，换个浏览器试试吧', palName: ['夜海', '熔金', '极光'], palPre: '配色 · ',
    camOn: '对着镜头挥挥手，光球会跟着你的手走；用力一挥会溅起水花', camOff: '摄像头没打开 —— 用鼠标、触摸或键盘一样能玩' },
  en: { title: 'Lumen Tide', sub: '光潮', cam: 'Camera', pal: 'Colour', camT: 'Shortcut C', palT: 'Shortcut 1 2 3',
    hint: '<b>Move / drag</b> to guide the orb · <b>tap</b> to splash · <b>hold</b> to dive and charge, release to burst<br><b>Camera</b>: wave at the lens · keyboard <b>arrows</b> + <b>space</b> · <b>1 2 3</b> palettes',
    noGL: 'Your browser does not support WebGL. Please try another browser.', palName: ['Night Sea', 'Molten Gold', 'Aurora'], palPre: 'Palette · ',
    camOn: 'Wave at the camera and the orb follows your hand; a hard swipe makes a splash', camOff: 'Camera unavailable. Mouse, touch and keyboard work just as well.' },
};
let lang = new URLSearchParams(location.search).get('lang');
try { lang = lang || localStorage.getItem('lotus-lang'); } catch (e) {}
lang = lang || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
if (lang !== 'zh' && lang !== 'en') lang = 'zh';
const tr = k => I18[lang][k];
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('tT').textContent = tr('title');
  document.getElementById('tS').textContent = tr('sub');
  const bc = document.getElementById('bCam'), bp = document.getElementById('bPal');
  bc.textContent = tr('cam'); bc.title = tr('camT'); bp.textContent = tr('pal'); bp.title = tr('palT');
  document.getElementById('bLang').textContent = lang === 'zh' ? 'EN' : '中';
  document.getElementById('hint').innerHTML = tr('hint');
}
applyLang();
document.getElementById('bLang').onclick = e => {
  e.stopPropagation(); lang = lang === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('lotus-lang', lang); } catch (e) {}
  applyLang();
};
function toast(msg, ms = 2600) {
  toastEl.textContent = msg; toastEl.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.style.opacity = 0, ms);
}
if (!gl) { toast(tr('noGL'), 1e9); throw new Error('no webgl'); }

/* ---------- 配色：海的暗部 / 中间调 / 浪尖，以及光球颜色 ---------- */
const PALETTES = [
  { name: '夜海', bg: [0.012, 0.02, 0.05], c0: [0.05, 0.09, 0.32], c1: [0.10, 0.52, 0.95], c2: [0.85, 0.95, 1.0], orb: [1.0, 0.74, 0.42] },
  { name: '熔金', bg: [0.035, 0.016, 0.01], c0: [0.30, 0.05, 0.05], c1: [0.98, 0.42, 0.10], c2: [1.0, 0.92, 0.62], orb: [0.55, 0.82, 1.0] },
  { name: '极光', bg: [0.008, 0.03, 0.035], c0: [0.02, 0.20, 0.20], c1: [0.10, 0.88, 0.62], c2: [0.85, 0.62, 1.0], orb: [1.0, 0.48, 0.78] },
];
let palIdx = 0;
const pal = JSON.parse(JSON.stringify(PALETTES[0])); // 当前显示的颜色（会平滑过渡）

/* ---------- 着色器 ---------- */
const VS_SEA = `
attribute vec2 a_xz;      // 粒子在海面上的位置 (x, z)
attribute vec2 a_hv;      // 模拟出的高度 h 和速度 v
uniform mat4 u_vp;
uniform float u_t, u_focal, u_far;
uniform vec3 u_orb, u_c0, u_c1, u_c2, u_orbC;
varying vec3 v_col;
void main(){
  float x = a_xz.x, z = a_xz.y;
  // 几层缓慢的“涌浪”，让海面在没人操作时也在呼吸
  float swell = 0.13*sin(x*0.55 + u_t*0.8) + 0.08*sin(z*0.85 - u_t*1.25 + x*0.3) + 0.04*sin((x+z)*1.7 + u_t*2.1);
  float h = clamp(a_hv.x, -3.5, 3.5);
  vec3 p = vec3(x, h*0.42 + swell, z);
  vec4 cp = u_vp * vec4(p, 1.0);
  gl_Position = cp;
  float sz = 0.055 * u_focal / cp.w;
  gl_PointSize = max(sz, 1.0);

  // 颜色：按高度在三个颜色之间渐变（像调色盘上的明暗过渡）
  float k = clamp(0.42 + h*0.33 + swell*1.6, 0.0, 1.0);
  vec3 col = mix(u_c0, u_c1, smoothstep(0.0, 0.6, k));
  col = mix(col, u_c2, smoothstep(0.6, 1.0, k));
  // 速度大的地方（浪在动）闪一点白光
  col += u_c2 * smoothstep(0.06, 0.45, abs(a_hv.y)) * 0.7;
  // 光球照亮周围的海面
  float d = distance(p, u_orb);
  col += u_orbC * (1.9*exp(-d*d*0.55) + 0.35*exp(-d*d*0.06));

  // 远处雾化 + 太小的点降低亮度，避免地平线过曝
  float fog = 1.0 - smoothstep(u_far*0.5, u_far, cp.w);
  float tiny = clamp(sz / 2.2, 0.18, 1.0);
  float near = smoothstep(0.6, 2.2, cp.w);
  v_col = col * fog * tiny * near * 0.42;
}`;
const FS_SEA = `
precision mediump float;
varying vec3 v_col;
void main(){
  float d = length(gl_PointCoord - 0.5) * 2.0;
  float a = 1.0 - smoothstep(0.35, 1.0, d);
  gl_FragColor = vec4(v_col * a, 1.0);
}`;
// 精灵程序：画光球、光晕和飞溅的水珠
const VS_SPR = `
attribute vec3 a_p; attribute float a_s; attribute vec4 a_c;
uniform mat4 u_vp; uniform float u_focal;
varying vec4 v_c;
void main(){
  vec4 cp = u_vp * vec4(a_p, 1.0);
  gl_Position = cp;
  gl_PointSize = clamp(a_s * u_focal / cp.w, 1.0, 1024.0);
  v_c = a_c;
}`;
const FS_SPR = `
precision mediump float;
varying vec4 v_c;
void main(){
  float d = length(gl_PointCoord - 0.5) * 2.0;
  float a = exp(-d*d*v_c.a) * (1.0 - smoothstep(0.85, 1.0, d));
  gl_FragColor = vec4(v_c.rgb * a, 1.0);
}`;

function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc = {};
  const na = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
  for (let i = 0; i < na; i++) { const n = gl.getActiveAttrib(p, i).name; loc[n] = gl.getAttribLocation(p, n); }
  const nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < nu; i++) { const n = gl.getActiveUniform(p, i).name; loc[n] = gl.getUniformLocation(p, n); }
  return { p, loc };
}
const SEA = program(VS_SEA, FS_SEA);
const SPR = program(VS_SPR, FS_SPR);

/* ---------- 小型矩阵工具（列主序，和 WebGL 一致） ---------- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function perspective(fovy, asp, n, f) {
  const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f);
  return [t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0];
}
function lookAt(e, c) {
  const z = norm(sub(e, c)), x = norm(cross([0, 1, 0], z)), y = cross(z, x);
  return { m: [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1], x, y, z };
}
function mul(a, b) {
  const o = new Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  return o;
}

/* ---------- 海面网格 + 波动模拟 ---------- */
const Z0 = -3.6, Z1 = 24;          // 海面的近端和远端
const EYE = [0, 3.4, -6], LOOK = [0, -0.4, 8];
let cols, rows, N, sp, X0, W, cur, prev, hv, bufXZ, bufHV;
let W_px, H_px, dpr, aspect, fov, focal, far;

function build() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W_px = Math.floor(innerWidth * dpr); H_px = Math.floor(innerHeight * dpr);
  cv.width = W_px; cv.height = H_px;
  aspect = innerWidth / innerHeight;
  fov = (aspect < 1 ? 74 : 55) * Math.PI / 180;     // 竖屏视角更大，海面不会显得太窄
  focal = (1 / Math.tan(fov / 2)) * H_px / 2;        // 世界尺寸 → 像素 的换算
  far = Math.hypot(EYE[1], Z1 - EYE[2]);
  const halfW = Math.tan(fov / 2) * aspect * far * 1.02 + 1;
  W = Math.min(2 * halfW, 72); X0 = -W / 2;
  const mobile = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
  const target = mobile ? 36000 : 82000;             // 粒子数量：手机少一些
  sp = Math.sqrt(W * (Z1 - Z0) / target);
  cols = Math.ceil(W / sp) + 1; rows = Math.ceil((Z1 - Z0) / sp) + 1; N = cols * rows;
  cur = new Float32Array(N); prev = new Float32Array(N); hv = new Float32Array(N * 2);
  const xz = new Float32Array(N * 2);
  for (let r = 0, i = 0; r < rows; r++) for (let c = 0; c < cols; c++, i++) {
    // 加一点点随机抖动，打破过于机械的网格感（更像笔触）
    xz[i * 2] = X0 + c * sp + (Math.random() - 0.5) * sp * 0.5;
    xz[i * 2 + 1] = Z0 + r * sp + (Math.random() - 0.5) * sp * 0.5;
  }
  if (bufXZ) { gl.deleteBuffer(bufXZ); gl.deleteBuffer(bufHV); }
  bufXZ = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufXZ); gl.bufferData(gl.ARRAY_BUFFER, xz, gl.STATIC_DRAW);
  bufHV = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bufHV); gl.bufferData(gl.ARRAY_BUFFER, hv, gl.DYNAMIC_DRAW);
  gl.viewport(0, 0, W_px, H_px);
}

// 一步波动方程：新高度 = 四邻居平均×2 − 上一帧高度，再乘阻尼
const DAMP = 0.986;
function waveStep() {
  const c = cols;
  for (let y = 1; y < rows - 1; y++) {
    let i = y * c + 1;
    for (let x = 1; x < c - 1; x++, i++) {
      prev[i] = ((cur[i - 1] + cur[i + 1] + cur[i - c] + cur[i + c]) * 0.5 - prev[i]) * DAMP;
    }
  }
  const t = cur; cur = prev; prev = t;
}
// 在 (wx, wz) 半径 R 内做事：mode 0 = 把海面“压”向目标深度；1 = 瞬间冲击
function touchSea(wx, wz, R, amt, mode) {
  const gx = (wx - X0) / sp, gz = (wz - Z0) / sp, Rc = R / sp;
  const x0 = Math.max(1, Math.floor(gx - Rc)), x1 = Math.min(cols - 2, Math.ceil(gx + Rc));
  const z0 = Math.max(1, Math.floor(gz - Rc)), z1 = Math.min(rows - 2, Math.ceil(gz + Rc));
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    const d2 = ((x - gx) ** 2 + (z - gz) ** 2) / (Rc * Rc);
    if (d2 >= 1) continue;
    const f = (1 - d2) * (1 - d2), i = z * cols + x;
    if (mode === 0) cur[i] += (-amt * f - cur[i]) * 0.16 * f;
    else cur[i] -= amt * f;
  }
}

/* ---------- 相机 & 屏幕 → 海面的射线 ---------- */
let camSway = 0, view, vp;
function updateCamera(t) {
  const e = [EYE[0] + camSway * 0.9 + Math.sin(t * 0.13) * 0.25, EYE[1] + Math.sin(t * 0.21) * 0.08, EYE[2]];
  view = lookAt(e, [LOOK[0] + camSway * 0.4, LOOK[1], LOOK[2]]);
  view.e = e;
  vp = mul(perspective(fov, aspect, 0.1, 80), view.m);
}
// 把屏幕上的 NDC 坐标（-1~1）投射到 y=0 的海面上
function rayToSea(nx, ny) {
  const th = Math.tan(fov / 2), { x, y, z, e } = view;
  ny = Math.min(ny, aspect < 1 ? 0.12 : 0.2);   // 指到天上时，限制在海平线附近
  for (let k = 0; k < 6; k++) {
    const d = [-z[0] + nx * th * aspect * x[0] + ny * th * y[0], -z[1] + nx * th * aspect * x[1] + ny * th * y[1], -z[2] + nx * th * aspect * x[2] + ny * th * y[2]];
    if (d[1] < -0.04) {
      const s = -e[1] / d[1];
      let wx = e[0] + d[0] * s, wz = e[2] + d[2] * s;
      wz = Math.min(Math.max(wz, Z0 + 1.2), Z1 - 5);
      wx = Math.min(Math.max(wx, X0 + 1.2), -X0 - 1.2);
      return [wx, wz];
    }
    ny -= 0.12; // 指向了天空，往下压一点再试
  }
  return [0, 6];
}

/* ---------- 光球、水珠和输入状态 ---------- */
const orb = { x: 0, z: 6, tx: 0, tz: 6, y: 0.6, depth: 0.35, charge: 0, flash: 0 };
const aim = { nx: 0, ny: -0.4 };            // 所有输入最终都写入这个“瞄准点”
let pressed = false, pressT = 0, lastInput = -1e9, pendingSplash = 0, pendingT = 0;
const sparks = [];                           // 飞溅的水珠
// 天空里稀疏的星星（放在很远的“穹顶”上，会轻轻闪烁）
const stars = Array.from({ length: 260 }, () => {
  const a = (Math.random() - 0.5) * 2.4, h = Math.pow(Math.random(), 1.6);
  return { x: Math.sin(a) * 60, y: 2 + h * 42, z: 4 + Math.cos(a) * 60, s: 0.16 + Math.random() * 0.4, p: Math.random() * 6.28, b: 0.25 + Math.random() * 0.75 };
});
const MAX_SPR = 1600;
const sprData = new Float32Array(MAX_SPR * 8);
const bufSPR = gl.createBuffer();

function splash(x, z, power) {
  touchSea(x, z, 0.55 + power * 0.12, 1.6 + power * 1.3, 1);
  orb.flash = Math.min(1.5, orb.flash + 0.5 + power * 0.25);
  const n = Math.min(40 + power * 70, MAX_SPR - 300 - sparks.length);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.6 + Math.random()) * (1.2 + power * 0.7);
    sparks.push({ x: x + Math.cos(a) * 0.3, y: 0.15, z: z + Math.sin(a) * 0.3,
      vx: Math.cos(a) * s * 0.55, vy: (2.2 + Math.random() * 3) * (0.7 + power * 0.35), vz: Math.sin(a) * s * 0.55,
      life: 1, hue: Math.random() });
  }
}

/* 指针（鼠标 + 触摸统一处理） */
const pointers = new Map();
function ndcOf(ev) { return [(ev.clientX / innerWidth) * 2 - 1, -((ev.clientY / innerHeight) * 2 - 1)]; }
let primaryId = null;
cv.addEventListener('pointerdown', ev => {
  lastInput = performance.now();
  const [nx, ny] = ndcOf(ev);
  pointers.set(ev.pointerId, 1);
  if (primaryId === null) {
    primaryId = ev.pointerId; cv.setPointerCapture(ev.pointerId);
    aim.nx = nx; aim.ny = ny; pressed = true; pressT = performance.now();
  } else {
    const [wx, wz] = rayToSea(nx, ny); splash(wx, wz, 1.2);  // 第二根手指：直接溅起水花
  }
});
cv.addEventListener('pointermove', ev => {
  if (ev.pointerType === 'mouse' || ev.pointerId === primaryId) {
    const [nx, ny] = ndcOf(ev); aim.nx = nx; aim.ny = ny; lastInput = performance.now();
  }
});
function release(ev) {
  pointers.delete(ev.pointerId);
  if (ev.pointerId !== primaryId) return;
  primaryId = null;
  if (!pressed) return;
  pressed = false;
  const hold = Math.min((performance.now() - pressT) / 1000, 1.6);
  pendingSplash = 1 + hold * 2.6; pendingT = performance.now();   // 按得越久，爆发越大
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

/* 键盘 */
const keys = {};
addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (k === ' ' && !keys[' ']) { pressed = true; pressT = performance.now(); ev.preventDefault(); }
  if (k === 'c') toggleCam();
  if ('123'.includes(k)) setPalette(+k - 1);
  keys[k] = true; lastInput = performance.now();
});
addEventListener('keyup', ev => {
  const k = ev.key.toLowerCase(); keys[k] = false;
  if (k === ' ' && pressed) { pressed = false; pendingSplash = 1 + Math.min((performance.now() - pressT) / 1000, 1.6) * 2.6; pendingT = performance.now(); }
});

/* 配色切换 */
function setPalette(i) { palIdx = (i + PALETTES.length) % PALETTES.length; toast(tr('palPre') + tr('palName')[palIdx], 1200); }
document.getElementById('bPal').onclick = () => setPalette(palIdx + 1);

/* ---------- 摄像头：不做手部识别，而是“帧差法”找画面里在动的地方 ---------- */
const cam = { on: false, stream: null, video: document.createElement('video'), prevGray: null, cool: 0, last: 0 };
const CW = 64, CH = 48;
const camCv = document.createElement('canvas'); camCv.width = CW; camCv.height = CH;
const camCtx = camCv.getContext('2d', { willReadFrequently: true });
const prevCv = document.getElementById('prev'), prevCtx = prevCv.getContext('2d');
const prevImg = prevCtx.createImageData(CW, CH);
cam.video.muted = true; cam.video.playsInline = true;
const bCam = document.getElementById('bCam');
bCam.onclick = toggleCam;
async function toggleCam() {
  if (cam.on) {
    cam.stream.getTracks().forEach(t => t.stop()); cam.on = false;
    bCam.classList.remove('on'); prevCv.style.display = 'none'; return;
  }
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: 'user' }, audio: false });
    cam.video.srcObject = cam.stream; await cam.video.play();
    cam.on = true; cam.prevGray = null; bCam.classList.add('on'); prevCv.style.display = 'block';
    toast(tr('camOn'));
  } catch (e) {
    toast(tr('camOff'));
  }
}
function camProcess(now) {
  if (!cam.on || now - cam.last < 33 || cam.video.readyState < 2) return;
  cam.last = now;
  camCtx.drawImage(cam.video, 0, 0, CW, CH);
  const px = camCtx.getImageData(0, 0, CW, CH).data;
  const gray = new Float32Array(CW * CH);
  let sx = 0, sy = 0, cnt = 0;
  const out = prevImg.data;
  for (let i = 0; i < CW * CH; i++) {
    const g = px[i * 4] * 0.3 + px[i * 4 + 1] * 0.59 + px[i * 4 + 2] * 0.11;
    gray[i] = g;
    const moving = cam.prevGray && Math.abs(g - cam.prevGray[i]) > 26;
    if (moving) { sx += i % CW; sy += (i / CW) | 0; cnt++; }
    // 预览：暗化的画面 + 运动像素用光球颜色高亮
    const o = pal.orb;
    out[i * 4] = moving ? o[0] * 255 : g * 0.35;
    out[i * 4 + 1] = moving ? o[1] * 255 : g * 0.38;
    out[i * 4 + 2] = moving ? o[2] * 255 : g * 0.5;
    out[i * 4 + 3] = 255;
  }
  prevCtx.putImageData(prevImg, 0, 0);
  cam.prevGray = gray;
  if (cnt > 14) {
    const cx = sx / cnt / CW, cy = sy / cnt / CH;
    // 镜像：你往右挥，光球往右走；画面上半部分对应远处的海
    aim.nx += ((1 - 2 * cx) * 0.95 - aim.nx) * 0.35;
    aim.ny += ((0.15 + (-0.95 - 0.15) * cy) - aim.ny) * 0.35;
    lastInput = now;
    if (cnt > CW * CH * 0.2 && now > cam.cool) { pendingSplash = 2.6; pendingT = now; cam.cool = now + 900; }
  }
}

/* ---------- 每一模拟步（固定 60Hz） ---------- */
let simT = 0, nextAuto = 0;
function tick(now) {
  simT += 1 / 60;
  // 键盘移动瞄准点
  const kx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
  const ky = (keys.arrowup || keys.w ? 1 : 0) - (keys.arrowdown || keys.s ? 1 : 0);
  if (kx || ky) { aim.nx = Math.max(-0.95, Math.min(0.95, aim.nx + kx * 0.018)); aim.ny = Math.max(-0.95, Math.min(0.2, aim.ny + ky * 0.014)); }
  // 没人操作时：光球自己在海上画“8”字巡游，偶尔点一下水
  if (now - lastInput > 4500) {
    aim.nx = Math.sin(simT * 0.31) * 0.62;
    aim.ny = -0.42 + Math.sin(simT * 0.47 + 1) * 0.3;
    if (now > nextAuto) { if (nextAuto) { pendingSplash = 1.4 + Math.random() * 1.8; pendingT = now; } nextAuto = now + 2600 + Math.random() * 2400; }
  }
  [orb.tx, orb.tz] = rayToSea(aim.nx, aim.ny);
  const ox = orb.x, oz = orb.z;
  orb.x += (orb.tx - orb.x) * 0.11; orb.z += (orb.tz - orb.z) * 0.11;
  const speed = Math.hypot(orb.x - ox, orb.z - oz) * 60;

  // 按住 = 蓄力：光球下沉，海面凹得更深
  const hold = pressed ? Math.min((now - pressT) / 1000, 1.6) : 0;
  orb.charge += (hold / 1.6 - orb.charge) * 0.15;
  orb.depth += ((0.35 + hold * 0.9) - orb.depth) * 0.1;
  touchSea(orb.x, orb.z, 1.05 + orb.charge * 0.5, orb.depth + Math.min(speed, 8) * 0.04, 0);

  // 松开后等光球到位再爆发
  if (pendingSplash && (Math.hypot(orb.tx - orb.x, orb.tz - orb.z) < 0.5 || now - pendingT > 450)) {
    splash(orb.x, orb.z, pendingSplash); pendingSplash = 0;
  }
  // 细雨：随机的小雨点让海面不至于太“干净”
  if (Math.random() < 0.05) touchSea(X0 + Math.random() * W, Z0 + 2 + Math.random() * (Z1 - Z0 - 6), 0.22, 0.5, 1);

  // 水珠：抛物线飞行，落回海面时再激起小涟漪
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.vy -= 9.0 / 60; s.x += s.vx / 60; s.y += s.vy / 60; s.z += s.vz / 60;
    s.life -= 0.004;
    if (s.y < 0 && s.vy < 0) { touchSea(s.x, s.z, 0.2, 0.35, 1); sparks.splice(i, 1); }
    else if (s.life <= 0) sparks.splice(i, 1);
  }
  orb.flash *= 0.93;
  orb.y = 0.55 - orb.charge * 0.45 + Math.sin(simT * 2.2) * 0.06;
  waveStep();
}

/* ---------- 绘制 ---------- */
function render(now) {
  const t = now / 1000;
  // 颜色平滑过渡
  const P = PALETTES[palIdx];
  for (const k of ['bg', 'c0', 'c1', 'c2', 'orb']) for (let j = 0; j < 3; j++) pal[k][j] += (P[k][j] - pal[k][j]) * 0.04;
  camSway += (aim.nx * 0.6 - camSway) * 0.02;
  updateCamera(t);

  gl.clearColor(pal.bg[0], pal.bg[1], pal.bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);   // 叠加混合：光点越密越亮

  // 1) 海面粒子
  for (let i = 0; i < N; i++) { hv[i * 2] = cur[i]; hv[i * 2 + 1] = cur[i] - prev[i]; }
  const L = SEA.loc;
  gl.useProgram(SEA.p);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufXZ); gl.enableVertexAttribArray(L.a_xz); gl.vertexAttribPointer(L.a_xz, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufHV); gl.bufferSubData(gl.ARRAY_BUFFER, 0, hv);
  gl.enableVertexAttribArray(L.a_hv); gl.vertexAttribPointer(L.a_hv, 2, gl.FLOAT, false, 0, 0);
  gl.uniformMatrix4fv(L.u_vp, false, vp);
  gl.uniform1f(L.u_t, t); gl.uniform1f(L.u_focal, focal); gl.uniform1f(L.u_far, far);
  const glow = 0.55 + orb.charge * 0.9 + orb.flash * 0.6;
  gl.uniform3f(L.u_orb, orb.x, orb.y * 0.3, orb.z);
  gl.uniform3fv(L.u_c0, pal.c0); gl.uniform3fv(L.u_c1, pal.c1); gl.uniform3fv(L.u_c2, pal.c2);
  gl.uniform3f(L.u_orbC, pal.orb[0] * glow, pal.orb[1] * glow, pal.orb[2] * glow);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.disableVertexAttribArray(L.a_xz); gl.disableVertexAttribArray(L.a_hv);

  // 2) 光球 + 水珠
  let n = 0;
  const put = (x, y, z, s, r, g, b, sharp) => {
    if (n >= MAX_SPR) return; const o = n++ * 8;
    sprData[o] = x; sprData[o + 1] = y; sprData[o + 2] = z; sprData[o + 3] = s;
    sprData[o + 4] = r; sprData[o + 5] = g; sprData[o + 6] = b; sprData[o + 7] = sharp;
  };
  for (const st of stars) {
    const tw = st.b * (0.55 + 0.45 * Math.sin(t * 1.3 + st.p)) * 1.1;
    put(st.x, st.y, st.z, st.s, pal.c2[0] * tw, pal.c2[1] * tw, pal.c2[2] * tw, 9);
  }
  const oc = pal.orb, pulse = 1 + Math.sin(t * 9) * 0.08 * orb.charge;
  put(orb.x, orb.y, orb.z, (4.2 + orb.flash * 2) * pulse, oc[0] * 0.22, oc[1] * 0.22, oc[2] * 0.22, 5);     // 大光晕
  put(orb.x, orb.y, orb.z, 1.5 * pulse, oc[0] * 0.8, oc[1] * 0.8, oc[2] * 0.8, 5);                         // 中层
  put(orb.x, orb.y, orb.z, 0.55, 1.0, 0.97, 0.92, 7);                                                       // 白色核心
  put(orb.x, -0.25, orb.z + 0.15, 2.6, oc[0] * 0.18, oc[1] * 0.18, oc[2] * 0.18, 3);                       // 水下倒影
  for (const s of sparks) {
    const a = Math.min(1, s.life * 1.4);
    const w = s.hue;  // 每颗水珠在光球色和浪尖色之间取一个颜色
    put(s.x, s.y, s.z, 0.1, (oc[0] * w + pal.c2[0] * (1 - w)) * a, (oc[1] * w + pal.c2[1] * (1 - w)) * a, (oc[2] * w + pal.c2[2] * (1 - w)) * a, 3);
  }
  const S = SPR.loc;
  gl.useProgram(SPR.p);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufSPR); gl.bufferData(gl.ARRAY_BUFFER, sprData.subarray(0, n * 8), gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(S.a_p); gl.vertexAttribPointer(S.a_p, 3, gl.FLOAT, false, 32, 0);
  gl.enableVertexAttribArray(S.a_s); gl.vertexAttribPointer(S.a_s, 1, gl.FLOAT, false, 32, 12);
  gl.enableVertexAttribArray(S.a_c); gl.vertexAttribPointer(S.a_c, 4, gl.FLOAT, false, 32, 16);
  gl.uniformMatrix4fv(S.u_vp, false, vp); gl.uniform1f(S.u_focal, focal);
  gl.drawArrays(gl.POINTS, 0, n);
  gl.disableVertexAttribArray(S.a_p); gl.disableVertexAttribArray(S.a_s); gl.disableVertexAttribArray(S.a_c);
}

/* ---------- 主循环 ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  camProcess(now);
  let steps = 0;
  while (acc >= 1 / 60 && steps < 4) { tick(now); acc -= 1 / 60; steps++; }
  if (steps === 4) acc = 0;
  render(now);
  requestAnimationFrame(frame);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 180); });
build(); updateCamera(0);
setTimeout(() => document.getElementById('hint').style.opacity = 0.0, 14000); // 提示 14 秒后淡出
cv.addEventListener('pointerdown', () => document.getElementById('hint').style.opacity = 0, { once: true });
requestAnimationFrame(frame);
// 测试用：在控制台可以调用 window.__lumen.splash(0, 6, 3)
window.__lumen = { splash, orb, setPalette };
</script>
</body>
</html>
