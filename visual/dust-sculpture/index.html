  droneO=AC.createOscillator();droneO.type='sawtooth';droneO.frequency.value=62;const df=AC.createBiquadFilter();df.type='lowpass';df.frequency.value=240;droneG=AC.createGain();droneG.gain.value=0;droneO.connect(df);df.connect(droneG);droneG.connect(AC.destination);droneO.start();}catch(e){return null}}

function chime(i){const a=AC;if(!a||muted)return;const P=[0,2,4,7,9],f=261.63*Math.pow(2,(P[i%5]+12*Math.floor(i/5))/12);

   g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.05/(k+1),t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+2.4);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+2.5);});}
// ================= 界面 =================
function applyLang(){document.documentElement.lang=lang;$('#tT').innerHTML=tr('title');$('#bNext').textContent=tr('next');$('#bSave').textContent=tr('save');$('#bLang').textContent=lang==='zh'?'EN':'中';
  document.title=lang==='zh'?'本来无一物，何处惹尘埃 · Dust Sculpture':'Dust Sculpture · 本来无一物，何处惹尘埃';if(!interacted)$('#hint').textContent=tr('hint');showName();}
let nameT=0;
function showName(){const s=tr('shapes')[morphing?nxt:cur];$('#nB').textContent=s[0];$('#nE').textContent=s[1];$('#name').classList.add('on');clearTimeout(nameT);nameT=setTimeout(()=>$('#name').classList.remove('on'),5200);}
function goNext(dir){if(morphing)return;nxt=((cur+(dir||1))%NS+NS)%NS;morphing=true;morph=0;idleT=0;showName();au();chime(nxt*2);}
$('#bNext').onclick=()=>{au();goNext(1);};
$('#bLang').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('lotus-lang',lang)}catch(e){}applyLang();};
$('#bSnd').onclick=()=>{au();muted=!muted;try{localStorage.setItem('dust-mute',muted?'1':'0')}catch(e){}$('#bSnd').style.opacity=muted?.4:1;};
$('#bSnd').style.opacity=muted?.4:1;
function touched(){if(interacted)return;interacted=true;$('#hint').classList.remove('on');}
// ================= 输入 =================
function addTrail(x,y,s){trI=(trI+1)%10;const q=trail[trI];q.x=x;q.y=y;q.s=Math.max(q.s*.5,s);}
const ptrs=new Map();let pinchD=0,zoom=1,zoomT=1,downT=0,downX=0,downY=0,movedFar=false;
const grav={x:0,y:0,g:0,on:false},waves=[];
function addWave(x,y,amp,age0){waves.push({x,y,age:age0||0,amp});if(waves.length>3)waves.shift();}
// 手机倾斜：转动 + 光源（iOS 需要在第一次触摸时授权）
const tilt={x:0,y:0,ok:false},tiltS={x:0,y:0};let tiltAsked=false;
function onOri(e){if(e.gamma==null||e.beta==null)return;tilt.ok=true;tilt.x=clamp(e.gamma/40,-1,1);tilt.y=clamp((e.beta-55)/40,-1,1);}
function askTilt(){if(tiltAsked)return;tiltAsked=true;try{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')addEventListener('deviceorientation',onOri);}).catch(()=>{});}
  else addEventListener('deviceorientation',onOri);}catch(e){}}
cv.addEventListener('pointerdown',e=>{au();lastIn=t;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});touched();if(e.pointerType==='touch')askTilt();
  if(ptrs.size===2){const [p1,p2]=[...ptrs.values()];pinchD=Math.hypot(p1.x-p2.x,p1.y-p2.y);down=false;grav.on=false;return;}
  down=true;downT=performance.now();downX=lastPX=e.clientX;downY=lastPY=e.clientY;movedFar=false;grav.on=false;
  if(downT-lastTap<340&&Math.hypot(e.clientX-tapX,e.clientY-tapY)<40){goNext(1);lastTap=0;}else{lastTap=downT;tapX=e.clientX;tapY=e.clientY;}
  addTrail(e.clientX,e.clientY,.6);});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [p1,p2]=[...ptrs.values()],d=Math.hypot(p1.x-p2.x,p1.y-p2.y);if(pinchD>0)zoomT=clamp(zoomT*Math.pow(d/pinchD,1.9),.4,4);pinchD=d;return;}
  const dx=lastPX==null?0:e.clientX-lastPX,dy=lastPY==null?0:e.clientY-lastPY,d=Math.hypot(dx,dy);
  light[0]=clamp((e.clientX/W-.5)*1.8,-1,1);light[1]=clamp(-(e.clientY/H-.5)*1.8,-1,1);lastIn=t;
  if(down&&!movedFar&&Math.hypot(e.clientX-downX,e.clientY-downY)>14)movedFar=true;
  if(grav.on){grav.x=e.clientX;grav.y=e.clientY;lastPX=e.clientX;lastPY=e.clientY;return;}
  if(d>5){addTrail(e.clientX,e.clientY,clamp(.22+d/80,.22,.75));lastPX=e.clientX;lastPY=e.clientY;scatterAmt=Math.min(1,scatterAmt+d/260);}
  if(down){yawV+=dx*.0042;pitchV+=dy*.0030;touched();}
});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinchD=0;
  if(grav.on){addWave(grav.x,grav.y,1.4);grav.on=false;if(AC)chime(4+((Math.random()*6)|0));}
  else if(down&&!movedFar&&performance.now()-downT<260){addWave(downX,downY,.85);if(AC)chime(2+((Math.random()*4)|0));}
  if(ptrs.size===0)down=false;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',()=>{lastPX=null;lastPY=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();au();touched();zoomT=clamp(zoomT*Math.exp(-e.deltaY*(e.ctrlKey?.012:.0028)),.4,4);},{passive:false});
if(MOBILE&&!(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'))askTilt();
// ---- 存成壁纸：在这一帧画完后立刻取图，加一行落款 ----
let saveReq=false,sayT=0;
function say(m){const h=$('#hint');h.textContent=m;h.classList.add('on');clearTimeout(sayT);sayT=setTimeout(()=>{h.classList.remove('on');},2400);}
function exportImg(){
  const c2=document.createElement('canvas');c2.width=cv.width;c2.height=cv.height;const x=c2.getContext('2d');x.drawImage(cv,0,0);
  const gr=x.createLinearGradient(0,c2.height*.8,0,c2.height);gr.addColorStop(0,'rgba(2,3,10,0)');gr.addColorStop(1,'rgba(2,3,10,.78)');x.fillStyle=gr;x.fillRect(0,c2.height*.8,c2.width,c2.height*.2);
  const fs=Math.max(12,Math.round(c2.height*.017)),ff=getComputedStyle(document.body).fontFamily;x.textAlign='center';
  x.font=fs+'px '+ff;x.fillStyle='rgba(230,236,255,.6)';x.fillText(lang==='zh'?'本来无一物，何处惹尘埃':'Dust Sculpture',c2.width/2,c2.height-fs*2.1);
  x.font=Math.round(fs*.72)+'px '+ff;x.fillStyle='rgba(200,212,255,.38)';x.fillText(tr('shapes')[cur][0]+' · '+tr('shapes')[cur][1].split(' · ')[0],c2.width/2,c2.height-fs*.9);
  c2.toBlob(bl=>{if(!bl)return;const name='dust-sculpture-'+Date.now()+'.png',file=new File([bl],name,{type:'image/png'});
    if(MOBILE&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:tr('title').replace('<br>','')}).catch(()=>{});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
    say(tr('saved'));},'image/png');
}
function doSave(){au();saveReq=true;const f=$('#flash');f.style.transition='none';f.style.opacity='.8';requestAnimationFrame(()=>{f.style.transition='opacity .7s ease-out';f.style.opacity='0';});chime(9);}
$('#bSave').onclick=doSave;
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();au();goNext(1);touched();}else if(e.key==='ArrowLeft'){au();goNext(-1);touched();}else if(e.key==='s'||e.key==='S'){doSave();}});
// ================= 尺寸 =================
function resize(){W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
addEventListener('resize',resize);
// ================= 主循环 =================
function rotM(y,p){ // 先绕 y 再绕 x，列主序
  const cy=Math.cos(y),sy=Math.sin(y),cp=Math.cos(p),sp=Math.sin(p);
  // R = Rx(p)·Ry(y)
  return new Float32Array([cy,sp*sy,-cp*sy, 0,cp,sp, sy,-sp*cy,cp*cy]);}
let last=performance.now(),fAcc=0,fN=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.033,Math.max(.001,(now-last)/1000));last=now;if(!STILL)t+=dt;
  fAcc+=dt;fN++;
  if(fAcc>1.5){const f=fAcc/fN;fAcc=0;fN=0;
    if(f>.024){if(nBody>NB*.3)nBody=Math.floor(nBody*.85);else if(dpr>.75){dpr=Math.max(.75,dpr-.15);resize();}}
    else if(f<.0175&&nBody<NB)nBody=Math.min(NB,Math.floor(nBody*1.1));}

  // 变形与自动换形态

  else if(!STILL){idleT+=dt;if(idleT>14)goNext(1);}
  // 指尖尘的衰减
  for(let i=0;i<10;i++){trail[i].s*=Math.exp(-dt*1.4);trailU[i*3]=trail[i].x;trailU[i*3+1]=trail[i].y;trailU[i*3+2]=trail[i].s;}
  scatterAmt*=Math.exp(-dt*1.6);
  // 按住 → 引力；冲击波；缩放；倾斜
  if(down&&!grav.on&&!movedFar&&ptrs.size<2&&performance.now()-downT>260){grav.on=true;grav.x=downX;grav.y=downY;}
  grav.g+=((grav.on?1:0)-grav.g)*Math.min(1,dt*(grav.on?5:10));
  for(let i=waves.length-1;i>=0;i--){waves[i].age+=dt;if(waves[i].age>1.8)waves.splice(i,1);}
  zoom+=(zoomT-zoom)*Math.min(1,dt*11);
  if(tilt.ok){tiltS.x+=(tilt.x-tiltS.x)*Math.min(1,dt*4);tiltS.y+=(tilt.y-tiltS.y)*Math.min(1,dt*4);}
  if(droneG&&AC){droneG.gain.setTargetAtTime(muted?0:grav.g*.07,AC.currentTime,.08);droneO.frequency.setTargetAtTime(62+grav.g*42,AC.currentTime,.1);}
  if(noiseG&&AC){noiseG.gain.setTargetAtTime(muted?0:scatterAmt*.05,AC.currentTime,.06);noiseF.frequency.setTargetAtTime(2400+scatterAmt*3200,AC.currentTime,.1);}
  // 光源：没人碰时自己绕
  if(tilt.ok&&t-lastIn>1.5){light[0]+=(tiltS.x*.9-light[0])*dt*3;light[1]+=(-tiltS.y*.9-light[1])*dt*3;}
  else if(t-lastIn>3){light[0]+=(Math.cos(t*.35)*.8-light[0])*dt*.6;light[1]+=(Math.sin(t*.27)*.6+.2-light[1])*dt*.6;}

  gl.viewport(0,0,cv.width,cv.height);

  const pal=new Float32Array(9);for(let i=0;i<3;i++)for(let k=0;k<3;k++)pal[i*3+k]=pa[i][k]+(pb[i][k]-pa[i][k])*e;
  gl.disable(gl.BLEND);gl.useProgram(pBg);gl.bindVertexArray(vaoE);
  gl.uniform2f(uBg.uRes,cv.width,cv.height);gl.uniform3f(uBg.uTint,pal[3],pal[4],pal[5]);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);

  const asp=W/H,fit=Math.min(1,asp*1.0)*zoom;

  gl.uniform1f(U.uSize,(MOBILE?2.6:2.2)*Math.max(.7,Math.min(1.25,Math.min(W,H)/720))*Math.min(1.6,Math.sqrt(130000/NB))*Math.pow(zoom,.6));
  gl.uniform1f(U.uFocus,4.2+.5*Math.sin(t*.21));gl.uniform1f(U.uFocusK,.5);gl.uniform1f(U.uBright,.5*Math.sqrt(130000/nBody));

}
// ================= 启动 =================
resize();applyLang();
setTimeout(()=>{if(!interacted)$('#hint').classList.add('on');},1800);
window.G={addWave,get waves(){return waves},get zoom(){return zoom},grav,tilt,doSave,get n(){return nBody},get dpr(){return dpr},get cur(){return cur},get t(){return t},next:goNext};
requestAnimationFrame(frame);
})();
