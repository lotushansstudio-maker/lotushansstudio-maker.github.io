<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>扫描取景 · Scan Frame</title>
<meta name="description" content="Frame any part of the world with your hands and it turns into glowing scanlines. 用手撑出一个取景框，框里的世界变成发光的扫描线。">
<meta property="og:title" content="扫描取景 · Scan Frame">
<meta property="og:description" content="Frame it with your hands, freeze it into a glowing scanline sticker. 用手撑出取景框，松手定格成一张发光的扫描线贴纸。">
<meta property="og:image" content="https://lotushansstudio-maker.github.io/visual/scan-frame/og.jpg">
<meta property="og:url" content="https://lotushansstudio-maker.github.io/visual/scan-frame/">
<style>
  :root{ --ink:#e6f1ff; --dim:rgba(220,236,255,.55); --line:rgba(200,225,255,.16); --acc:#7cc8ff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#02040a;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #gl{touch-action:none;cursor:crosshair}
  #ov{pointer-events:none}
  .title{position:fixed;left:max(20px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));pointer-events:none}
  .title h1{font-family:"Songti SC","Noto Serif SC","STSong",Georgia,serif;font-weight:400;
    font-size:clamp(24px,4vw,42px);letter-spacing:.18em;text-shadow:0 0 18px rgba(90,170,255,.35)}
  .title p{margin-top:6px;font-size:11.5px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
  .ctrl{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));
    display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
  button{font:inherit;font-size:12px;letter-spacing:.06em;color:var(--ink);background:rgba(8,14,28,.5);
    border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .3s,border-color .3s,color .3s}
  button:hover{background:rgba(30,50,90,.6)}
  button.on{border-color:rgba(124,200,255,.8);color:#fff;box-shadow:0 0 14px rgba(80,170,255,.35) inset}
  .bottom{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;
    align-items:center;gap:10px;pointer-events:none}
  .chips{display:none!important;gap:6px;pointer-events:auto;max-width:94vw;overflow-x:auto;padding:2px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{white-space:nowrap;padding:7px 12px}
  .chips button .k{opacity:.45;margin-right:5px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
  .chips button.hero{font-weight:500}
  .hint{font-size:12px;color:var(--dim);letter-spacing:.05em;text-align:center;width:min(94vw,680px);line-height:1.75;transition:opacity 1s}
  .hint b{color:var(--ink);font-weight:500}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:12px;
    background:rgba(8,14,28,.8);border:1px solid var(--line);font-size:13px;opacity:0;pointer-events:none;transition:opacity .4s;
    text-align:center;max-width:86vw;line-height:1.6}
  #file{display:none}
  /* 第一次定格后界面退场，只留画面（和原作一样干净） */
  .title,.hint,.ctrl{transition:opacity 1.2s}
  body.quiet .title, body.quiet .hint{opacity:0}
  body.quiet .ctrl{opacity:.28} body.quiet .ctrl:hover{opacity:1}
  @media (max-width:600px){
    .hint{font-size:11px} .title p{letter-spacing:.2em}
    .title h1{font-size:24px} .title p{margin-top:3px}
    .ctrl{top:calc(max(16px,env(safe-area-inset-top)) + 58px);right:auto;left:max(16px,env(safe-area-inset-left));
      justify-content:flex-start;max-width:none;gap:5px} .ctrl button{padding:6px 10px;font-size:11px}
    .hint .l2{display:none}
    .chips button{padding:6px 10px;font-size:11.5px}
  }
  html[lang=en] .title h1{letter-spacing:.08em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div class="title"><h1 id="tT">扫描取景</h1><p id="tS">Scan Frame</p></div>
<div class="ctrl">
  <button id="bCam">摄像头</button>
  <button id="bPhoto">照片</button>
  <button id="bSave">保存</button>
  <button id="bClear">清空</button>
  <button id="bLang">EN</button>
</div>
<div class="bottom">
  <div class="chips" id="chips"></div>
  <div class="hint" id="hint"></div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*">

<script>
'use strict';
/* =========================================================
   扫描取景 Scan Frame
   灵感：Instagram @wxll.hx 的 TouchDesigner 手势取景框作品
   - 用手（或鼠标 / 双指）撑出一个矩形取景框，框内画面实时变成发光的扫描线
   - 扫描线：每条横线按画面亮度被"推高" y' = y + k·L(x,y)，亮处线条起伏、挤在一起，像等高线浮雕
   - 松手 → 框内这一帧冻结成贴纸，留在画面上，越叠越像拼贴
   - 全部滤镜在 GPU 着色器里算；不依赖外部库（只有摄像头手势用 MediaPipe）
   ========================================================= */

const glc = document.getElementById('gl'), ov = document.getElementById('ov');
const gl = glc.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
const ctx = ov.getContext('2d');
const toastEl = document.getElementById('toast');

/* ================= 双语（和主页共用 lotus-lang） ================= */
const ORDER = [1, 2, 3, 4, 0];                 // 原作出场顺序
const MODES = [
  { zh: '扫描线', en: 'Scanline', tag: 'SCAN', f: "y′ = y + k·L(x,y)" },
  { zh: '线描', en: 'Sketch', tag: 'SOBEL', f: '|∇I| = √(Gx² + Gy²)' },
  { zh: '色阶', en: 'Poster', tag: 'POSTER', f: 'q = ⌊n·L⌋ / n' },
  { zh: '四叉树', en: 'Quadtree', tag: 'QUAD', f: 'split ⇔ σ² > τ' },
  { zh: '晒蓝', en: 'Cyanotype', tag: 'CYAN', f: 'L + d(x,y) > θ' },
];
const I18 = {
  zh: { title: '扫描取景', sub: 'Scan Frame', cam: '摄像头', photo: '照片', scene: '场景', save: '保存', clear: '清空',
    hint: '<b>拖出一个框</b>，<b>松手</b>定格 · 手机<b>双指</b>撑框 · 每定格一次自动换一种滤镜<br><span class="l2"><b>摄像头</b>：举起手，框跟着走，<b>拇指碰食指</b>就定格（双手可撑出框的大小） · <b>Z</b> 撤销</span>',
    noGL: '你的浏览器不支持 WebGL，换个浏览器试试吧', camLoad: '加载手势识别', camOn: '举起手，取景框跟着手走；拇指碰一下食指就定格，再张开碰一下定格下一张',
    camOff: '摄像头没打开 —— 用鼠标或手指拖框一样能玩', camFail: '手势识别没加载成功 —— 画面仍是摄像头，用鼠标或手指拖框', saved: '已保存图片', cleared: '已清空', undo: '撤销一张' },
  en: { title: 'Scan Frame', sub: '扫描取景', cam: 'Camera', photo: 'Photo', scene: 'Scene', save: 'Save', clear: 'Clear',
    hint: '<b>Drag a frame</b>, <b>release</b> to freeze · <b>two fingers</b> on phones · each freeze switches to the next filter<br><span class="l2"><b>Camera</b>: raise a hand and the frame follows; <b>touch thumb to index</b> to freeze (two hands set the frame size) · <b>Z</b> undo</span>',
    noGL: 'Your browser does not support WebGL. Please try another browser.', camLoad: 'Loading hand tracking', camOn: 'Raise a hand and the frame follows it; tap thumb to index to freeze, open and tap again for the next one',
    camOff: 'Camera unavailable. Drag with mouse or finger instead.', camFail: 'Hand tracking failed to load. Camera stays on; drag with mouse or finger.', saved: 'Image saved', cleared: 'Cleared', undo: 'Undone' },
};
let lang = new URLSearchParams(location.search).get('lang');
try { lang = lang || localStorage.getItem('lotus-lang'); } catch (e) {}
lang = lang || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
if (lang !== 'zh' && lang !== 'en') lang = 'zh';
const tr = k => I18[lang][k];
const chipsEl = document.getElementById('chips');
MODES.forEach((m, i) => {
  const b = document.createElement('button'); b.dataset.i = i; if (i === 0) b.classList.add('hero');
  b.onclick = e => { e.stopPropagation(); setMode(i); };
  chipsEl.appendChild(b);
});
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('tT').textContent = tr('title');
  document.getElementById('tS').textContent = tr('sub');
  document.getElementById('bCam').textContent = tr('cam');
  document.getElementById('bPhoto').textContent = src.kind === 'photo' ? tr('scene') : tr('photo');
  document.getElementById('bSave').textContent = tr('save');
  document.getElementById('bClear').textContent = tr('clear');
  document.getElementById('bLang').textContent = lang === 'zh' ? 'EN' : '中';
  document.getElementById('hint').innerHTML = tr('hint');
  [...chipsEl.children].forEach((b, i) => { b.innerHTML = `<span class="k">${i + 1}</span>${MODES[i][lang]}`; b.classList.toggle('on', i === mode); });
}
function toast(msg, ms = 2600) {
  toastEl.textContent = msg; toastEl.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.style.opacity = 0, ms);
}

/* ================= WebGL 基础 ================= */
let mode = 1;
const src = { kind: 'scene', tex: null, w: 1, h: 1, mirror: 0 };   // scene 程序化场景 / cam 摄像头 / photo 照片
applyLang();
if (!gl) { toast(tr('noGL'), 1e9); throw new Error('no webgl'); }

const VS = `attribute vec2 p; varying vec2 v; void main(){ v=p*.5+.5; gl_Position=vec4(p,0.,1.); }`;
// 矩形贴片：把纹理的一块（uTR）画到屏幕的一块（uR）
const VS_RECT = `attribute vec2 p; uniform vec4 uR, uTR; varying vec2 vt, vl;
void main(){ vec2 q=p*.5+.5; vl=q; vt=mix(uTR.xy,uTR.zw,q); gl_Position=vec4(mix(uR.xy,uR.zw,q)*2.-1.,0.,1.); }`;

const COMMON = `precision highp float;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }`;

/* ---- 1. 程序化场景：几团光滑的"雕塑"在黑暗里缓慢转动（没有摄像头时当素材） ---- */
const FS_SCENE = COMMON + `
varying vec2 v; uniform vec2 uRes; uniform float uT; uniform vec2 uM;
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float map(vec3 p){
  p.xz*=rot(uT*.22+uM.x*.9); p.yz*=rot(.25+uM.y*.6);
  float d=length(p*vec3(1.,1.12,1.))-.95;                       // 主体：略扁的球
  for(int i=0;i<5;i++){                                          // 五个小球绕着主体公转，平滑融合
    float fi=float(i), a=uT*(.35+fi*.07)+fi*1.2566;
    vec3 c=vec3(cos(a)*1.35, sin(a*1.3+fi)*.75, sin(a)*1.1);
    d=smin(d, length(p-c)-(.32+.06*sin(uT+fi)), .55);
  }
  vec3 q=p; q.xy*=rot(.6); q.yz*=rot(uT*.3);
  float tor=length(vec2(length(q.xz)-1.75,q.y))-.07;           // 一圈细环
  return min(d,tor);
}
vec3 nrm(vec3 p){ vec2 e=vec2(.002,-.002);
  return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx)); }
void main(){
  vec2 uv=(v*uRes-.5*uRes)/min(uRes.x,uRes.y)*(uRes.x<uRes.y?1.15:1.);
  vec3 ro=vec3(0.,0.,5.3), rd=normalize(vec3(uv*.95,-1.6));
  float t=0., hit=0.;
  for(int i=0;i<60;i++){ vec3 p=ro+rd*t; float d=map(p); if(d<.002){hit=1.;break;} t+=d*.9; if(t>10.) break; }
  float L=0.;
  if(hit>.5){
    vec3 p=ro+rd*t, n=nrm(p);
    vec3 l=normalize(vec3(-.6,.8,.6));
    float dif=max(dot(n,l),0.), rim=pow(1.-max(dot(n,-rd),0.),2.5);
    float ao=clamp(map(p+n*.25)/.25,0.,1.);
    L=pow(dif,1.3)*.9*ao+rim*.5+.03;
  }
  L+=.05*exp(-dot(uv,uv)*2.);                                    // 背景一点点光
  gl_FragColor=vec4(vec3(L),hit);
}`;

/* ---- 2. 摄像头 / 照片：铺满屏幕（cover），摄像头左右镜像 ---- */
const FS_TEX = `precision highp float; varying vec2 v; uniform sampler2D uTex, uMask; uniform vec2 uScale; uniform float uMirror, uHasMask;
void main(){ vec2 t=(v-.5)*uScale+.5; if(uMirror>.5) t.x=1.-t.x;
  float m=uHasMask>.5?texture2D(uMask,t).r:1.;
  gl_FragColor=vec4(texture2D(uTex,t).rgb,m); }`;

/* ---- 3. 滤镜：五种，同一个着色器里按 uMode 分支 ---- */
const FS_FX = COMMON + `
varying vec2 v; uniform sampler2D uSrc, uPrev; uniform vec2 uRes, uSrcPx; uniform float uT, uMode, uDpr, uFb;
float lum(vec2 uv){ return dot(texture2D(uSrc,uv).rgb, vec3(.299,.587,.114)); }
float lumB(vec2 uv){ vec2 d=uSrcPx*1.5;
  return (lum(uv)*4.+lum(uv+vec2(d.x,0.))+lum(uv-vec2(d.x,0.))+lum(uv+vec2(0.,d.y))+lum(uv-vec2(0.,d.y)))/8.; }
vec3 ramp(float I){                       // 扫描线配色：深海蓝 → 冰蓝 → 近白
  vec3 c=vec3(.006,.02,.06);
  c=mix(c,vec3(.03,.16,.55),smoothstep(.02,.3,I));
  c=mix(c,vec3(.25,.68,1.),smoothstep(.25,.7,I));
  c=mix(c,vec3(.86,.97,1.),smoothstep(.85,1.3,I));
  return c;
}
void main(){
  vec2 px=v*uRes; vec3 col;
  if(uMode<.5){
    /* 扫描线：亮度把横线往上推（等高线浮雕），亮处再叠一层随时间流动的波纹 → 摩尔纹 */
    float L=smoothstep(.03,.85,lumB(v));
    float M=smoothstep(.15,.85,texture2D(uSrc,v).a);
    L=mix(L*.13,.22+.9*L,M);                              // 人像遮罩：人发光，墙变暗
    float per=3.2*uDpr;
    float warp=sin(px.x/(13.*uDpr)+uT*2.6+L*8.)*L*.85;
    float ph=px.y/per+L*7.+warp;
    float ln=pow(.5+.5*cos(6.2831853*ph),2.2);
    float I=L*(.1+1.02*ln)+L*L*.12;
    float h=hash(floor(px/uDpr)+fract(uT*7.)*91.);
    I+=step(.993-.012*L,h)*(.3+.7*L);                   // 暗处星点噪声
    float beam=1.-fract(uT*.11);                          // 一道缓慢下扫的光带
    I+=exp(-pow((v.y-beam)*uRes.y/(46.*uDpr),2.))*.22*(.25+L);
    col=ramp(I);
    vec3 pv=texture2D(uPrev,v).rgb;                        // 上一帧衰减后保留 → 手动起来有残影
    col=max(col,pv*uFb-.003);
  } else if(uMode<1.5){
    /* 线描：Sobel 边缘 + 暗部斜线排线，白纸底 */
    vec2 d=uSrcPx*1.3;
    float tl=lum(v+vec2(-d.x,d.y)),t=lum(v+vec2(0.,d.y)),tr=lum(v+d);
    float l=lum(v-vec2(d.x,0.)),r=lum(v+vec2(d.x,0.));
    float bl=lum(v-d),b=lum(v-vec2(0.,d.y)),br=lum(v+vec2(d.x,-d.y));
    float gx=-tl-2.*l-bl+tr+2.*r+br, gy=tl+2.*t+tr-bl-2.*b-br;
    float e=smoothstep(.12,.75,length(vec2(gx,gy)));
    vec3 sc=texture2D(uSrc,v).rgb;
    vec3 paper=vec3(.955,.952,.935)+(hash(floor(px/uDpr))-.5)*.02;
    col=mix(paper,sc*.6+vec3(.18,.18,.12),e*.62);           // 边缘带一点原画面的颜色
  } else if(uMode<2.5){
    /* 色阶：亮度切成四档，黄色版错位两像素，像丝网印刷 */
    vec2 o=uSrcPx*2.6;
    float b0=step(.42,lumB(v)), b1=step(.42,lumB(v+vec2(o.x,o.y))), b2=step(.42,lumB(v-vec2(o.x*.6,o.y*1.4)));
    col=mix(vec3(.03,.52,.1),vec3(.975,.97,.95),b0);
    if(b1!=b0) col=vec3(.98,.86,.08);
    else if(b2!=b0) col=mix(vec3(.2,.55,1.),vec3(1.,.55,.8),step(.5,hash(floor(px/(3.*uDpr)))));
  } else if(uMode<3.5){
    /* 四叉树：细节多（方差大）的格子继续一分为四，平的地方保持大格 */
    float sz=112.*uDpr; vec2 c0=floor(px/sz)*sz; float m=0.; bool done=false; vec3 mc=vec3(0.);
    for(int k=0;k<5;k++){
      if(!done){
        c0=floor(px/sz)*sz; float s=0.,s2=0.;
        mc=vec3(0.);
        for(int a=0;a<3;a++) for(int b=0;b<3;b++){ vec3 rc=texture2D(uSrc,(c0+(vec2(a,b)+.5)/3.*sz)/uRes).rgb; float q=dot(rc,vec3(.299,.587,.114)); mc+=rc; s+=q; s2+=q*q; }
        m=s/9.; mc/=9.; float var=s2/9.-m*m;
        if(var<.0022||k==4) done=true; else sz*=.5;
      }
    }
    col=floor(mc*6.)/5.*.85+mc*.15;                 // 原色略微分档
    vec2 f=px-c0; float edge=step(min(f.x,f.y),.9*uDpr);
    col=mix(col,vec3(.03,.035,.045),edge*.92);
  } else {
    /* 晒蓝：阈值 + 有序抖动，蓝白两色 */
    float L=lumB(v);
    vec2 q=mod(floor(px/uDpr),4.);
    float bay=mod(q.x*8.+q.y*4.+mod(q.x+q.y,2.)*2.+q.y,16.)/16.;
    float k=smoothstep(-.03,.03,L+(bay-.5)*.12-.44);
    col=mix(vec3(.07,.27,.6),vec3(.95,.97,1.),k);
  }
  gl_FragColor=vec4(col,1.);
}`;

/* ---- 4. 背景：原画面压暗、去色、偏冷，留出"黑底"让发光的框跳出来 ---- */
const FS_BG = COMMON + `varying vec2 v; uniform sampler2D uSrc; uniform vec2 uRes; uniform float uT, uDim;
void main(){
  vec3 c=texture2D(uSrc,v).rgb*uDim;             // 和原作一样：框外就是原画面
  gl_FragColor=vec4(c,1.);
}`;

/* ---- 5. 贴片（贴纸 / 实时框）：细白边 + 定格时一闪 ---- */
const FS_RECT = `precision highp float; varying vec2 vt, vl; uniform sampler2D uTex; uniform vec2 uSize; uniform float uA, uBorder, uFlash, uDpr;
void main(){
  vec3 c=texture2D(uTex,vt).rgb;
  vec2 d=min(vl,1.-vl)*uSize;
  float b=1.-smoothstep(.0,1.1*uDpr,min(d.x,d.y));
  c=mix(c,vec3(.88,.95,1.),b*uBorder);
  c+=uFlash*(.55+.45*(1.-vl.y));
  gl_FragColor=vec4(c,uA);
}`;

/* ---- 6. 辉光：取亮部 → 1/4 分辨率模糊 → 叠回去 ---- */
const FS_BRIGHT = `precision highp float; varying vec2 v; uniform sampler2D uTex; uniform vec2 uPx;
void main(){ vec3 c=(texture2D(uTex,v+uPx*vec2(-1,-1)).rgb+texture2D(uTex,v+uPx*vec2(1,-1)).rgb+texture2D(uTex,v+uPx*vec2(-1,1)).rgb+texture2D(uTex,v+uPx).rgb)*.25;
  float l=max(c.r,max(c.g,c.b)); gl_FragColor=vec4(c*smoothstep(.32,.95,l),1.); }`;
const FS_BLUR = `precision highp float; varying vec2 v; uniform sampler2D uTex; uniform vec2 uDir;
void main(){ vec3 c=texture2D(uTex,v).rgb*.227;
  c+=(texture2D(uTex,v+uDir*1.385).rgb+texture2D(uTex,v-uDir*1.385).rgb)*.316;
  c+=(texture2D(uTex,v+uDir*3.231).rgb+texture2D(uTex,v-uDir*3.231).rgb)*.07;
  gl_FragColor=vec4(c,1.); }`;
const FS_FINAL = `precision highp float; varying vec2 v; uniform sampler2D uTex, uBloom; uniform float uK;

  const put = (key, h) => {
    const c = C[key];
    if (c && now - c.t < 900) { c.p.x += (h.mid.x - c.p.x) * .6; c.p.y += (h.mid.y - c.p.y) * .6; c.t = now; }   // 平滑一点，去抖
    else C[key] = { p: { ...h.mid }, t: now };
  };
  if (hs.length >= 2 && ks.length >= 2) {
    const [a, b] = ks, d1 = dist(C[a].p, hs[0].mid) + dist(C[b].p, hs[1].mid), d2 = dist(C[a].p, hs[1].mid) + dist(C[b].p, hs[0].mid);
    if (d1 <= d2) { put(a, hs[0]); put(b, hs[1]); } else { put(a, hs[1]); put(b, hs[0]); }
  } else if (hs.length >= 2) { put('A', hs[0]); put('B', hs[1]); for (const k in C) if (k !== 'A' && k !== 'B') delete C[k]; }
  else if (ks.length) { let best = ks[0]; for (const k of ks) if (dist(C[k].p, hs[0].mid) < dist(C[best].p, hs[0].mid)) best = k; put(best, hs[0]); }
  else put('A', hs[0]);
  for (const k in C) if (now - C[k].t > 900) delete C[k];          // 丢失太久的角才丢掉
  const keys = Object.keys(C).sort((x, y) => C[y].t - C[x].t).slice(0, 2);   // 最近的两个角
  if (keys.length >= 2) cam.twoT = now;
  let r;
  if (keys.length >= 2) {
    const a = C[keys[0]].p, b = C[keys[1]].p;
    r = { x0: a.x, y0: a.y, x1: b.x, y1: b.y };
  } else if (now - (cam.twoT || -1e9) > 1500) {
    const h = hs[0], m = Math.min(CW, CH), w = m * (CW > CH ? .62 : .78), hh = m * (CW > CH ? .46 : .9);
    r = { x0: h.palm.x - w / 2, y0: h.palm.y - hh / 2, x1: h.palm.x + w / 2, y1: h.palm.y + hh / 2 };
  } else r = cam.openRect;                                           // 刚刚还是双手：先别动
  if (!r) return;
  const touching = hs.some(h => h.pr < .2), allOpen = hs.every(h => h.pr > .36);
  if (allOpen || !cam.openRect) { cam.openRect = r; }
  live = cam.openRect;
  if (allOpen) cam.armed = true;
  if (touching && cam.armed && now - cam.lastFreeze > 600) {
    cam.armed = false; cam.lastFreeze = now;
    liveShown = { ...norm(cam.openRect) };
    cam.pending = true;                           // 下一帧先把整个框的滤镜算完再定格，避免边缘缺块
  }
}

/* ================= 无人操作时：一个取景框自己慢慢游走（演示） ================= */
function demoStep(now, dt) {
  const idle = now - lastInput > 5000 && !ptrs.size && !(cam.on && cam.hands.length);
  if (!idle) { if (liveBy === 'demo') endLive(false); return; }
  if (liveBy && liveBy !== 'demo') return;
  if (liveBy !== 'demo') { startLive('demo'); demoT = 0; }
  demoT += dt;
  const t = demoT * .00022, m = Math.min(CW, CH);
  const cx = CW * (.5 + .2 * Math.sin(t * 1.3)), cy = CH * (.5 + .12 * Math.sin(t * 1.9 + 1));
  const w = m * (.5 + .1 * Math.sin(t * 2.1)) * (CW > CH ? 1.25 : .95), h = m * (.36 + .07 * Math.cos(t * 1.7)) * (CW > CH ? 1 : 1.35);
  live = { x0: cx - w / 2, y0: cy - h / 2, x1: cx + w / 2, y1: cy + h / 2 };
}

/* ================= 渲染 ================= */
let wantSave = false, last = performance.now(), T0 = performance.now();
function renderSource(t) {
  target(srcFB); gl.disable(gl.BLEND);
  if ((src.kind === 'cam' && cam.on && cam.video.readyState >= 2) || src.kind === 'photo') {
    if (src.kind === 'cam') {
      const v = cam.video; src.w = v.videoWidth || 640; src.h = v.videoHeight || 480;
      gl.bindTexture(gl.TEXTURE_2D, src.tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, v); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    }
    const u = use(P.tex), [sx, sy] = coverScale(src.w, src.h);
    gl.uniform2f(u.uScale, sx, sy); gl.uniform1f(u.uMirror, src.mirror && src.kind === 'cam' ? 1 : 0);
    const hm = src.kind === 'cam' && cam.hasMask && maskTex;
    gl.uniform1f(u.uHasMask, hm ? 1 : 0);
    bindT(0, src.tex, u.uTex); bindT(1, hm ? maskTex : src.tex, u.uMask); draw();
  } else {
    const u = use(P.scene);
    gl.uniform2f(u.uRes, srcFB.w, srcFB.h); gl.uniform1f(u.uT, t); gl.uniform2f(u.uM, mx, my); draw();
  }
}
function frame(now) {
  const dt = Math.min(64, now - last); last = now;
  const t = (now - T0) / 1000;
  mx += (tmx - mx) * .03; my += (tmy - my) * .03;
  if (cam.on) { handStep(now); segStep(now); }
  demoStep(now, dt);

  // 显示用的框：手势和演示做平滑，鼠标直接跟手
  if (live) {
    const r = norm(live);
    if (!liveShown) liveShown = { ...r };
    const k = liveBy === 'ptr' ? 1 : liveBy === 'hand' ? .45 : .2;
    for (const key of ['x0', 'y0', 'x1', 'y1']) liveShown[key] += (r[key] - liveShown[key]) * k;
    liveA = Math.min(1, liveA + dt / 250);
  } else { liveA = 0; liveShown = null; }

  renderSource(t);

  // 滤镜（只算框附近，省电）
  const R = liveShown;
  const has = R && (R.x1 - R.x0) > 2 && (R.y1 - R.y0) > 2;
  if (has) {
    const nxt = fxCur === fxA ? fxB : fxA;
    target(nxt); gl.enable(gl.SCISSOR_TEST);
    const pad = 4;
    const sx0 = Math.max(0, Math.floor(R.x0 * DPR) - pad), sy0 = Math.max(0, Math.floor((CH - R.y1) * DPR) - pad);
    gl.scissor(sx0, sy0, Math.min(W, Math.ceil((R.x1 - R.x0) * DPR) + pad * 2), Math.min(H, Math.ceil((R.y1 - R.y0) * DPR) + pad * 2));
    const u = use(P.fx);
    bindT(0, srcFB.tex, u.uSrc); bindT(1, fxCur.tex, u.uPrev);
    gl.uniform2f(u.uRes, W, H); gl.uniform2f(u.uSrcPx, 1 / srcFB.w, 1 / srcFB.h);
    gl.uniform1f(u.uT, t); gl.uniform1f(u.uMode, mode); gl.uniform1f(u.uDpr, DPR);
    gl.uniform1f(u.uFb, src.kind === 'photo' ? .0 : .86);
    draw(); gl.disable(gl.SCISSOR_TEST); fxCur = nxt;
  }
  if (cam.pending) { cam.pending = false; if (liveBy === 'hand') freeze(); }

  // 合成：暗背景 → 贴纸 → 实时框
  target(comp); gl.disable(gl.BLEND);
  { const u = use(P.bg); bindT(0, srcFB.tex, u.uSrc); gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uT, t);
    gl.uniform1f(u.uDim, src.kind === 'scene' ? .55 : 1); draw(); }
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  const ur = use(P.rect); gl.uniform1f(ur.uDpr, DPR);
  for (const s of stickers) {
    const age = (now - s.t0) / 1000, e = Math.min(1, age / .45), sc = 1;
    const cx = (s.r.x0 + s.r.x1) / 2, cy = (s.r.y0 + s.r.y1) / 2, hw = (s.r.x1 - s.r.x0) / 2 * sc, hh = (s.r.y1 - s.r.y0) / 2 * sc;
    gl.uniform4f(ur.uR, (cx - hw) / CW, 1 - (cy + hh) / CH, (cx + hw) / CW, 1 - (cy - hh) / CH);
    gl.uniform4f(ur.uTR, 0, 0, 1, 1); gl.uniform2f(ur.uSize, s.w, s.h);
    gl.uniform1f(ur.uA, 1); gl.uniform1f(ur.uBorder, 0); gl.uniform1f(ur.uFlash, 0);
    bindT(0, s.tex, ur.uTex); draw();
  }
  if (has) {
    gl.uniform4f(ur.uR, R.x0 / CW, 1 - R.y1 / CH, R.x1 / CW, 1 - R.y0 / CH);
    gl.uniform4f(ur.uTR, R.x0 / CW, 1 - R.y1 / CH, R.x1 / CW, 1 - R.y0 / CH);
    gl.uniform2f(ur.uSize, (R.x1 - R.x0) * DPR, (R.y1 - R.y0) * DPR);
    gl.uniform1f(ur.uA, liveA); gl.uniform1f(ur.uBorder, 0); gl.uniform1f(ur.uFlash, 0);
    bindT(0, fxCur.tex, ur.uTex); draw();
  }
  gl.disable(gl.BLEND);

  // 辉光
  target(bl1); { const u = use(P.bright); gl.uniform2f(u.uPx, 1 / W, 1 / H); bindT(0, comp.tex, u.uTex); draw(); }
  for (let i = 0; i < 2; i++) {
    target(bl2); { const u = use(P.blur); gl.uniform2f(u.uDir, 1.6 / bl1.w, 0); bindT(0, bl1.tex, u.uTex); draw(); }
    target(bl1); { const u = use(P.blur); gl.uniform2f(u.uDir, 0, 1.6 / bl1.h); bindT(0, bl2.tex, u.uTex); draw(); }
  }
  target(null); { const u = use(P.fin); bindT(0, comp.tex, u.uTex); bindT(1, bl1.tex, u.uBloom); gl.uniform1f(u.uK, 0); draw(); }

  drawOverlay(now, t);
  if (wantSave) { wantSave = false; save(); }
  requestAnimationFrame(frame);
}

/* ================= 叠加层：标尺、角标、公式、手指点（2D 画布） ================= */
const MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
function drawOverlay(now, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textBaseline = 'alphabetic';
  const R = liveShown;
  if (R && (R.x1 - R.x0) > 2) {                 // 原作：只有一圈细白线
    ctx.strokeStyle = `rgba(255,255,255,${.92 * liveA})`; ctx.lineWidth = 1.5;
    ctx.strokeRect(R.x0, R.y0, R.x1 - R.x0, R.y1 - R.y0);
  }
  // 鼠标悬停时的十字准星
  if (ptrHover && !ptrs.size && liveBy !== 'ptr') {
    ctx.strokeStyle = 'rgba(200,230,255,.4)'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(ptrHover.x - 9, ptrHover.y); ctx.lineTo(ptrHover.x + 9, ptrHover.y);
    ctx.moveTo(ptrHover.x, ptrHover.y - 9); ctx.lineTo(ptrHover.x, ptrHover.y + 9); ctx.stroke();
  }
}

/* ================= 保存图片：WebGL 画面 + 叠加层合成一张 PNG ================= */
function save() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(glc, 0, 0); x.drawImage(ov, 0, 0);
  x.font = `${Math.round(11 * DPR)}px ${MONO}`; x.fillStyle = 'rgba(200,230,255,.6)';
  x.fillText('Scan Frame · lotushansstudio-maker.github.io/visual', 16 * DPR, H - 14 * DPR);
  c.toBlob(b => {
    if (!b) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `scan-frame-${Date.now()}.png`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(tr('saved'), 1000);
  }, 'image/png');
}

setMode(ORDER[0]);
requestAnimationFrame(frame);
</script>
</body>
